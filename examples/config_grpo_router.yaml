# EXAMPLE — GRPO for a query ROUTER with a DETERMINISTIC exact-match reward.
# No encoder model: the gold answer is a canonical route list ("a,b") or empty
# (abstention), so string equality IS the reward — language-agnostic, free.
model_path: models/router-fused-sft
data_path: data/sft-router/train.jsonl
adapter_dir: adapters/router-grpo
results_path: router_grpo_results.json
log_path: logs/router_grpo.log

# exact_match_set: order-insensitive comma-set equality — "route_a, route_b"
# and "route_a,route_b" are the same routing decision.
reward: exact_match_set
min_response_length: 0     # empty gold = abstention is a VALID answer

n_candidates: 6
clip_eps: 0.2
kl_coeff: 0.05
temperature: 0.7
max_tokens: 64             # answers are short route lists
max_seq_length: 1536       # long route-set prompts + short answers

n_iters: 300
batch_size: 2
learning_rate: 1.0e-6      # keep the decimal point: YAML parses bare `1e-6` as a string
lora_layers: 16
lora_rank: 32
lora_scale: 2.0
lora_dropout: 0.0
early_stop_patience: 8
early_stop_warmup: 10
seed: 42
